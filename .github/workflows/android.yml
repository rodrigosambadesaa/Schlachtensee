name: Android build and tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Probe live backend transports (non-blocking)
        continue-on-error: true
        run: |
          for scheme in https http; do
            echo "::group::Backend via $scheme"
            if curl --silent --show-error --fail --location --max-redirs 3 \
              --max-time 15 \
              --write-out "HTTP=%{http_code} final=%{url_effective}\\n" \
              --output /tmp/schlachtensee-backend-body \
              "$scheme://jmnberlin.de/jmn_ajax.php?anfrage=6"; then
              head -c 120 /tmp/schlachtensee-backend-body
              echo
            else
              echo "Backend request failed (not a build failure)"
            fi
            echo "::endgroup::"
          done
      - name: Install Android 33
        run: |
          SDK_MANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          "$SDK_MANAGER" --install "platforms;android-33" "build-tools;33.0.1"
      - name: Run Android unit tests, assemble and lint
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug \
            --no-daemon --stacktrace --max-workers=2 \
            -Dorg.gradle.parallel=false \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
      - name: Archive diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
